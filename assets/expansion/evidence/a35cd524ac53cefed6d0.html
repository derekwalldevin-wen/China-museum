        <meta
            name="description"
            content="甘肃简牍博物馆是目前中国汉简藏量最大的，集简牍收藏、保护、研究、展示、教学于一体的国家一级博物馆。现收藏各类文物50129件（组），三级以上的珍贵文物共31943件（组），其中一级文物1679件（组）。馆藏文物以简牍为主，有天水放马滩秦简、居延新简、肩水金关汉简、地湾汉简、敦煌马圈湾汉简、悬泉汉简及魏晋简牍等共计近4万枚，与简牍相伴出土的纸张、丝绸及纺织品、竹木器漆、金属器、动植物标本等文物有1万余件。数量众多、品类丰富的馆藏简牍文物中蕴含、保留、书写、叙述了辉煌中华两千多年前在丝绸之路上的动人故事、真实事件、智慧光芒，记录的是泱泱中华文明对世界文明所作出的卓越贡献"
