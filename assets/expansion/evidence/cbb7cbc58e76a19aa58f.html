	lw = $(".leftmenu").width();

		$('#menuopenbox').hide()

		$(".navbox li").removeClass('on');

		$(this).addClass('on');

	});

		var h = $(window).height();
		$('#fr').css({'top':(h/2-300)+'px'});
		$("#fr").width($(window).width()-parseInt($("#fr").css("margin-left")))
		$('#menushade b').css({'top':(h/2-250)+'px'});
		
	}
